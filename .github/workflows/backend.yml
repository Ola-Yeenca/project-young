name: Backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hoy
          POSTGRES_PASSWORD: hoy
          POSTGRES_DB: hoy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hoy" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://hoy:hoy@localhost:5432/hoy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Production settings check
        env:
          DJANGO_ALLOWED_HOSTS: houseofyoung.example
        run: python manage.py check --deploy --fail-level WARNING
      - name: Tests
        run: python manage.py test --verbosity 2
